{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Whiteboard{% endblock %}</title>
  {# Lets phones add the site to the home screen and open it full screen like an app. #}
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="{% static 'board/manifest.json' %}">
  <link rel="icon" type="image/png" href="{% static 'board/icons/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'board/icons/apple-touch-icon.png' %}">
  <meta name="apple-mobile-web-app-title" content="Whiteboard">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    :root { --bg: #f7f7f5; --ink: #222; --muted: #777; --line: #d6d6d2; --card: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    button, input { font: inherit; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
